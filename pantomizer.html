<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}</style>
<title>Пипетка Pantone</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: экран телефона без прокрутки, как камера iOS. Кадр из пикселей занимает всё свободное место,
   снизу закреплена панель: размер пикселя, миниатюра палитры, затвор, переворот камеры.
   Интерфейс только серый и чёрный, цвет живёт в пикселях и на образцах Pantone. */
:root {
  --bg: #EFEFF1;
  --grid: #DEDEE2;
  --block: #D2D2D6;
  --block-2: #E3E3E6;
  --ink: #0C0C0E;
  --ink-2: #55555C;
  --view: #0C0C0E;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0F11;
    --grid: #1F1F23;
    --block: #2C2C31;
    --block-2: #1A1A1E;
    --ink: #F1F1F3;
    --ink-2: #A0A0A9;
    --view: #050506;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0F11;
  --grid: #1F1F23;
  --block: #2C2C31;
  --block-2: #1A1A1E;
  --ink: #F1F1F3;
  --ink-2: #A0A0A9;
  --view: #050506;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 72px 72px;
  background-position: -1px -1px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.4;
}
button { font: inherit; color: inherit; border-radius: 0; }
button:focus-visible, .finder:focus-visible, .size:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.app { flex: 1; min-height: 0; width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }

/* Кадр */
.finder { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--view); touch-action: manipulation; cursor: crosshair; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#view { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; transition: transform .2s ease-out; }
.tag { position: absolute; left: 0; margin: 0; padding: 6px 8px; font: 500 11px/1 var(--mono); pointer-events: none; }
.badge { top: 0; background: var(--ink); color: var(--bg); letter-spacing: .08em; text-transform: uppercase; }
.hint { top: 23px; background: var(--block); color: var(--ink); font-weight: 400; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .3s ease-out; }
.flash.on { opacity: .9; transition: none; }
.cam { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.start { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: grid; justify-items: center; gap: 8px; padding: 0 24px; }
.start-btn { width: min(100%, 320px); min-height: 58px; border: 1px solid var(--ink); background: var(--block); color: var(--ink); font-size: 17px; }
.upload-btn { min-height: 50px; background: transparent; font-size: 15px; }
.start .tag { position: static; background: var(--block); color: var(--ink); text-align: center; line-height: 1.35; max-width: 320px; }

.btn {
  min-height: 48px; padding: 12px 14px; border: 0; background: var(--block); color: var(--ink);
  font: 500 15px/1.15 var(--font); display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer;
}
.btn:active { background: var(--ink); color: var(--bg); }
.btn.primary { background: var(--ink); color: var(--bg); min-height: 58px; font-size: 17px; }
.btn.primary:active { opacity: .8; }
.btn[disabled] { opacity: .6; cursor: default; }

/* Названия цветов кадра */
.strip { z-index: 25; position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 6px; padding: 8px; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.chips { display: flex; gap: 6px; }
.chip {
  flex: none; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px 0 0;
  background: var(--bg); color: var(--ink); border: 1px solid var(--ink); cursor: pointer; white-space: nowrap; font: 500 14px var(--font);
}
.chip i { display: block; width: 40px; align-self: stretch; margin: -1px 0 -1px -1px; border-right: 1px solid var(--ink); }
.chip small { font: 500 11px var(--mono); opacity: .7; }
.chip.sel { background: var(--ink); color: var(--bg); }
.chip.all { padding: 0 14px; background: var(--block); }

/* Нижняя панель */
.dock { flex: none; border-top: 1px solid var(--ink); }
.zoom { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; background: var(--block-2); border-bottom: 1px solid var(--ink); }
.zoom button { height: 48px; border: 0; background: transparent; font: 400 26px/1 var(--mono); cursor: pointer; }
.size { -webkit-appearance: none; appearance: none; width: 100%; height: 48px; margin: 0; background: transparent; cursor: pointer; }
.size::-webkit-slider-runnable-track { height: 1px; background: var(--ink); }
.size::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 18px; margin-top: -18px; background: var(--ink); clip-path: polygon(0 0, 100% 0, 50% 100%); border: 0; }
.size::-moz-range-track { height: 1px; background: var(--ink); }
.size::-moz-range-thumb { width: 20px; height: 18px; background: var(--ink); border: 0; border-radius: 0; clip-path: polygon(0 0, 100% 0, 50% 100%); transform: translateY(-9px); }
.shutter-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 16px; }
.thumb { position: relative; justify-self: start; width: 58px; height: 58px; padding: 0; border: 1px solid var(--ink); background: var(--block); cursor: pointer; overflow: hidden; }
.thumb-grid { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.thumb-grid i { display: block; }
.thumb small { position: absolute; right: 0; bottom: 0; padding: 3px 5px; background: var(--ink); color: var(--bg); font: 700 11px/1 var(--mono); }
.thumb em { position: absolute; inset: 0; display: grid; place-items: center; font: 400 22px var(--mono); font-style: normal; }
.shutter { width: 80px; height: 80px; padding: 6px; border: 3px solid var(--ink); background: transparent; cursor: pointer; }
.shutter i { display: grid; place-items: center; width: 100%; height: 100%; background: var(--ink); color: var(--bg); font: 400 30px/1 var(--mono); font-style: normal; }
.shutter:active i { opacity: .7; }
.shutter.again i { background: var(--block); color: var(--ink); }
.flip { justify-self: end; width: 58px; height: 58px; padding: 0; border: 0; background: var(--block); cursor: pointer; display: grid; place-items: center; }
.flip:active { background: var(--ink); color: var(--bg); }

/* Шторка с данными цвета */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 62vh; overflow: auto;
  background: var(--bg); border-top: 3px solid var(--ink);
  padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px));
  animation: up .16s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-in { max-width: 560px; margin: 0 auto; }
.sheet-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 6px; background: var(--bg); }
.cap { margin: 0; font: 500 11px/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; }
.x { width: 44px; height: 44px; border: 0; background: var(--block); font: 400 24px/1 var(--mono); cursor: pointer; }
.sw2 { display: grid; grid-template-columns: 1fr 1fr; height: 72px; margin-top: 8px; box-shadow: 0 0 0 1px var(--ink); }
.sw2 div { display: flex; align-items: flex-end; padding: 8px; font: 700 11px var(--mono); }
.sh-name { margin: 12px 0 0; font: 500 clamp(24px, 7vw, 30px)/1.1 var(--font); letter-spacing: -.01em; overflow-wrap: anywhere; }
.sh-hex { margin: 2px 0 12px; font: 700 18px var(--mono); }
.tbl { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
.tbl > div { min-width: 0; padding: 8px 10px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.tbl small { display: block; font: 500 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.tbl b { font: 700 14px var(--mono); overflow-wrap: anywhere; }
.alts { margin-top: 10px; border-top: 1px solid var(--ink); }
.alt {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; min-height: 50px;
  padding: 6px 0; border: 0; border-bottom: 1px solid var(--ink); background: transparent; text-align: left; cursor: pointer;
}
.alt i { display: block; width: 36px; height: 36px; box-shadow: 0 0 0 1px var(--ink); }
.alt b { display: block; font: 500 15px var(--font); }
.alt span { display: block; font: 400 12px var(--mono); color: var(--ink-2); }
.alt em { font: 700 13px var(--mono); font-style: normal; }
.sub { margin: 12px 0 6px; color: var(--ink-2); }
.sw2.one { grid-template-columns: 1fr; }
.sheet.over { z-index: 35; }
.harm { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--ink); border: 1px solid var(--ink); }
.harm-t { display: block; min-width: 0; padding: 0; border: 0; background: var(--bg); text-align: left; cursor: pointer; }
.harm-t i { display: block; height: 52px; }
.harm-t small { display: block; padding: 6px 8px 0; font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.harm-t b { display: block; padding: 2px 8px 0; font: 500 14px/1.2 var(--font); overflow-wrap: anywhere; }
.harm-t span { display: block; padding: 0 8px 8px; font: 400 11px var(--mono); color: var(--ink-2); }
.actions { display: grid; gap: 1px; margin-top: 12px; background: var(--ink); }

/* Сохранённые цвета */
.palscreen {
  position: fixed; inset: 0; z-index: 30; overflow: auto;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 72px 72px; background-position: -1px -1px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
}
.pal-in { max-width: 560px; margin: 0 auto; }
.pal-head { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; margin-bottom: 12px; }
.back { min-height: 48px; padding: 0 16px; border: 0; background: var(--block); font: 500 15px var(--font); cursor: pointer; }
.empty { margin: 0; padding: 14px; background: var(--block-2); border: 1px solid var(--ink); font-size: 14px; }
.pal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
.tile { position: relative; background: var(--bg); min-width: 0; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.tile-main { display: block; width: 100%; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
.tile-sw { display: block; height: 96px; }
.tile-t { display: block; padding: 8px 10px 10px; }
.tile-t b { display: block; font: 500 15px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-t span { display: block; font: 400 12px var(--mono); color: var(--ink-2); }
.tile-del { position: absolute; top: 0; right: 0; width: 40px; height: 40px; border: 0; background: var(--bg); color: var(--ink); font: 400 20px/1 var(--mono); cursor: pointer; }
.row2 { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 1px; margin-top: 12px; background: var(--ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 40; max-width: 92%; padding: 9px 12px; background: var(--ink); color: var(--bg); font: 500 12px/1.3 var(--mono); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app" id="app">
  <div class="finder" id="finder" tabindex="0" role="application" aria-label="Кадр из пикселей. Коснитесь пикселя, чтобы узнать название цвета. Стрелки двигают выбор.">
    <canvas id="view"></canvas>
    <span class="tag badge" id="badge">Пример</span>
    <p class="tag hint" id="hint">Коснитесь пикселя, чтобы узнать цвет</p>
    <div class="start" id="start">
      <button class="btn start-btn" id="btnStart" type="button">Включить пантомизатор</button>
      <button class="btn start-btn upload-btn" id="btnUpload" type="button">Загрузить фото</button>
      <input type="file" id="fileIn" accept="image/*" hidden>
      <p class="tag" id="startNote" hidden></p>
    </div>
    <div class="strip" id="strip" hidden><div class="chips" id="chips"></div></div>
    <div class="flash" id="flash"></div>
    <video id="cam" class="cam" playsinline muted autoplay></video>
  </div>

  <footer class="dock">
    <div class="zoom">
      <button id="zMinus" type="button" aria-label="Пиксели мельче">−</button>
      <input class="size" id="size" type="range" min="0" max="14" step="1" value="9" aria-label="Размер пикселя">
      <button id="zPlus" type="button" aria-label="Пиксели крупнее">+</button>
    </div>
    <div class="shutter-row">
      <button class="thumb" id="btnPal" type="button" aria-label="Сохранённые цвета"><span class="thumb-grid" id="thumb"></span><em id="thumbEmpty">▦</em><small id="palCount" hidden></small></button>
      <button class="shutter" id="btnShot" type="button" aria-label="Включить пантомизатор"><i id="shotIcon"></i></button>
      <button class="flip" id="btnFlip" type="button" aria-label="Перевернуть камеру">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M20 9A8 8 0 0 0 5.4 6.6M4 3.5V8h4.5"/><path d="M4 15a8 8 0 0 0 14.6 2.4M20 20.5V16h-4.5"/></svg>
      </button>
    </div>
  </footer>
</div>

<section class="palscreen" id="palscreen" hidden aria-label="Сохранённые цвета">
  <div class="pal-in">
    <div class="pal-head">
      <button class="back" id="btnBack" type="button">← Камера</button>
      <p class="cap" id="palTitle">■ Сохранённые цвета</p>
    </div>
    <p class="empty" id="palEmpty">Пока пусто. Сохраняйте цвета из карточки пикселя или кнопкой «Сохранить все» под кадром.</p>
    <div class="pal" id="palGrid"></div>
    <div class="row2" id="palActions" hidden>
      <button class="btn" id="btnCopyAll" type="button">Копировать HEX</button>
      <button class="btn" id="btnClear" type="button">Очистить</button>
    </div>
  </div>
</section>

<aside class="sheet" id="sheet" hidden aria-label="Информация о цвете">
  <div class="sheet-in">
    <div class="sheet-head">
      <p class="cap" id="shTitle">■ Пиксель</p>
      <button class="x" id="btnShClose" type="button" aria-label="Закрыть">×</button>
    </div>
    <div class="sw2" id="shSw2">
      <div id="shSwL"><span id="shLblL">Пиксель</span></div>
      <div id="shSwR"><span id="shLblR">Pantone</span></div>
    </div>
    <p class="sh-name" id="shName">Ultra Violet</p>
    <p class="sh-hex" id="shHex">#5F4B8B</p>
    <div class="tbl">
      <div><small>RGB</small><b id="vRgb">95 75 139</b></div>
      <div><small>Lab</small><b id="vLab">36 · 17 · −28</b></div>
      <div id="cDe"><small>ΔE 2000</small><b id="vDe">1.2</b></div>
      <div id="cMatch"><small>Совпадение</small><b id="vMatch">97%</b></div>
    </div>
    <p class="cap sub">Гармонии</p>
    <div class="harm" id="shHarm"></div>
    <p class="cap sub">Похожие Pantone</p>
    <div class="alts" id="shAlts"></div>
    <div class="actions">
      <button class="btn primary" id="btnShSave" type="button">Сохранить в палитру</button>
      <button class="btn" id="btnShHex" type="button">Копировать HEX</button>
    </div>
  </div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    var seen = new Set(), merged = [];
    list.concat(saved).forEach(function (t) { if (!seen.has(t) && byTcx.has(t)) { seen.add(t); merged.push(t); } });
    saved = merged.slice(0, 12); persist(); renderPalette();
  }
  function renderPalette() {
    var gridEl = $("palGrid"); gridEl.textContent = "";
    $("palEmpty").hidden = saved.length > 0; $("palActions").hidden = saved.length === 0; gridEl.hidden = saved.length === 0;
    $("palTitle").textContent = saved.length ? "■ Сохранённые цвета · " + saved.length : "■ Сохранённые цвета";
    saved.forEach(function (tcx) {
      var p = PANTONE[byTcx.get(tcx)], cell = document.createElement("div"); cell.className = "tile";
      var b = document.createElement("button"); b.type = "button"; b.className = "tile-main"; b.setAttribute("aria-label", "Открыть " + p[1]);
      var sw = document.createElement("span"); sw.className = "tile-sw"; sw.style.background = "#" + p[2];
      var t = document.createElement("span"); t.className = "tile-t";
      var b1 = document.createElement("b"); b1.textContent = p[1]; var s1 = document.createElement("span"); s1.textContent = "#" + p[2].toUpperCase();
      t.appendChild(b1); t.appendChild(s1); b.appendChild(sw); b.appendChild(t);
      b.addEventListener("click", function () { openFree(byTcx.get(tcx)); });
      var del = document.createElement("button"); del.type = "button"; del.className = "tile-del"; del.textContent = "×"; del.setAttribute("aria-label", "Убрать " + p[1]);
      del.addEventListener("click", function () { saved = saved.filter(function (x) { return x !== tcx; }); persist(); renderPalette(); });
      cell.appendChild(b); cell.appendChild(del); gridEl.appendChild(cell);
    });
    // Миниатюра в нижней панели: последние цвета 2×2, как последнее фото в камере iOS.
    var th = $("thumb"); th.textContent = "";
    saved.slice(0, 4).forEach(function (t) { var i = document.createElement("i"); i.style.background = "#" + PANTONE[byTcx.get(t)][2]; th.appendChild(i); });
    $("thumbEmpty").hidden = saved.length > 0;
    var pc = $("palCount"); pc.hidden = saved.length === 0; pc.textContent = String(saved.length);
  }
  $("btnClear").addEventListener("click", function () { saved = []; persist(); renderPalette(); });
  $("btnCopyAll").addEventListener("click", function () {
    copy(saved.map(function (t) { var p = PANTONE[byTcx.get(t)]; return p[1] + " #" + p[2].toUpperCase(); }).join("\n"), "цветов: " + saved.length);
  });
  function openPalette() {
    if (sel) closeSheet();
    if (stream && showing === "still" && staticSrc) {
      // Снятый кадр не теряем: камеру выключаем, кадр остаётся как фото.
      stopStream(); wantCam = false; photoMode = true; setView();
    } else if (stream) suspendCamera();
    $("palscreen").hidden = false;
  }
  function closePalette() {
    if (viewIdx !== null) { viewIdx = null; sheet.hidden = true; sheet.classList.remove("over"); }
    $("palscreen").hidden = true;
    if (wantCam && !stream) startCamera();
  }
  $("btnPal").addEventListener("click", openPalette);
  $("btnBack").addEventListener("click", closePalette);

  /* ---------- Старт ---------- */
  renderPalette(); setView(); resize();
})();
</script>

</html>
